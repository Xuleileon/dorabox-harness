name: Apply DoraBox Browser Harness backend

on:
  push:
    branches: [feat/browser-harness-handoff]
    paths:
      - scripts/apply-dorabox-backend.py
      - .github/workflows/apply-dorabox-backend.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/browser-harness-handoff
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply source patch
        run: python scripts/apply-dorabox-backend.py
      - name: Normalize generated helper insertion
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/browser_harness/helpers.py')
          text = path.read_text(encoding='utf-8')
          start_marker = 'def drain_events():  return _send({"meta": "drain_events"})["events"]'
          end_marker = 'def _js_snippet('
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          segment = text[start:end].replace('\\n', '\n')
          path.write_text(text[:start] + segment + text[end:], encoding='utf-8')
          PY
      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e . pytest
      - name: Compile and test
        run: |
          python -m compileall -q src
          python -m pytest -q
      - name: Build wheel
        run: python -m pip install build && python -m build
      - name: Commit verified implementation
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests docs .env.example SKILL.md
          git commit -m 'feat: add DoraBox CDP transport and same-tab handoff'
          git push origin HEAD:feat/browser-harness-handoff
